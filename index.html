<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="stylesheet.css">
        <title>Kamigate</title>
    </head>
   <body>
    <header>
        <div class="header-logo">
        Kamigate
        </div>
        <div class="header-list">
             <ul>
                <li>プログラミングとは</li>
                <li>学べるレッスン</li>
                <li>お問い合わせ</li>
            </ul>
        </div>
    </header>
    <div class="main">
         <div class="copy-container">
                <h1>HELLO WORLD<span>.</span></h1>
                <h2>プログラミングの世界へようこそ</h2>
        </div>
        <!--コンテンツ欄-->
        <div class="contents">
            <div class="contents-logo">
                学べるレッスン
            </div>
            <ul>
                 <li class="lesson-item">
                    <div class="lesson-card html-card">
                        HTML&CSS
                        <img src="images/HTML_CSS.png" alt="HTMLとCSS">
                    </div>
                </li>
                <li class="lesson-item">
                    <div class="lesson-card PHP-card">
                        PHP
                        <img src="images/PHP.png" alt="PHP">
                    </div>
                </li>
                <li class="lesson-item">
                    <div class="lesson-card Ruby-card">
                        Ruby
                        <img src="images/Ruby.png" alt="Ruby">
                    </div>
                </li>
                <li class="lesson-item">
                    <div class="lesson-card Swift-card">
                        Swift
                        <img src="images/swift.png" alt="Swift">
                    </div>
                </li>
            </ul>
        </div>
        <!--お問い合わせ欄-->
        <div class="contact-form">
            <h3>お問い合わせ</h3>
            <form>
                <label for="mail">メールアドレス（必須）</label>
                <input class='mail-input' id="mail" type="email" required>
                <label for="message">お問い合わせ内容（必須）</label>
                <textarea id="message" required></textarea>
                <p>＊必須項目は必ずご入力ください</p>
                <input type="submit" value="送信">
            </form>
        </div>
    </div>
    <footer>
        <div class="footer-logo">
            Kamigate
        </div>
        <div class="footer-list">
            <ul>
                <li class="footer-contents">
                    <div>会社概要</div>
                </li>
                <li class="footer-contents">
                    <div>採用</div>
                </li>
                <li class="footer-contents">
                    <div>お問い合わせ</div>
                </li>
            </ul>
        </div>
    </footer>
   
   </body>
</html>
